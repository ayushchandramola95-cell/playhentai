<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#purpleGrad)" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Glowing TV Screen Frame -->
  <rect x="76" y="148" width="360" height="260" rx="44" fill="#090d16" stroke="url(#purpleGrad)" stroke-width="14" filter="url(#glow)"/>
  <rect x="76" y="148" width="360" height="260" rx="44" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.9"/>
  
  <!-- TV Antenna Lines -->
  <path d="M340 64 L256 148 L172 64" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Play Triangle Badge (Golden Yellow) -->
  <polygon points="216,218 336,278 216,338" fill="url(#goldGrad)" stroke="#fde047" stroke-width="4" stroke-linejoin="round"/>
</svg>